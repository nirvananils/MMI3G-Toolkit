name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Verify tag matches builder/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $fileVersion = (python -c "import sys; sys.path.insert(0,'builder'); import version; print(version.__version__)").Trim()
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "version.py=$fileVersion  tag=$tagVersion"
          if ($fileVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match builder/version.py $fileVersion. Bump version.py, commit, then retag."
          }

      - name: Build EXE
        run: python -m PyInstaller packaging/mmi3g-gui.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMI3G-Toolkit-Builder
          path: dist/MMI3G-Toolkit-Builder.exe

      - name: Attach EXE to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MMI3G-Toolkit-Builder.exe
          generate_release_notes: true
